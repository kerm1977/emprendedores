<!-- Vista Perfil + modal de confirmacion de cierre de sesion -->
<section class="app-view" id="view-perfil">
    <div class="perfil-card">
        <div class="perfil-avatar"><i class="fas fa-user"></i></div>
        <h3 id="perfil-nombre">—</h3>
        <p class="perfil-rol" id="perfil-rol">—</p>
        <div id="perfil-stats" hidden></div>
        <div class="perfil-datos">
            <div class="perfil-dato">
                <i class="fas fa-phone"></i>
                <span id="perfil-telefono">—</span>
            </div>
            <div class="perfil-dato">
                <i class="fas fa-id-card"></i>
                <span id="perfil-cedula">—</span>
            </div>
        </div>
        <button class="perfil-btn-ajustes" id="perfil-notif"
                type="button" onclick="abrirNotificaciones()" hidden>
            <i class="fas fa-bell"></i> Notificaciones
            (<b id="perfil-notif-count">0</b>)
        </button>
        <button class="perfil-btn-ajustes" id="btn-dashboard" hidden>
            <i class="fas fa-gauge-high"></i> Dashboard
        </button>
        <button class="perfil-btn-ajustes" id="btn-ajustes-perfil" hidden>
            <i class="fas fa-gear"></i> Ajustes
        </button>
        <button class="perfil-btn-salir" id="btn-salir-perfil">
            <i class="fas fa-right-from-bracket"></i> Cerrar sesión
        </button>
    </div>
</section>

<!-- Modal tematico del diccionario (mismo estilo que modal-salir) -->
<div class="modal-salir" id="dic-modal" hidden>
    <div class="salir-caja">
        <h3 id="dic-modal-titulo">—</h3>
        <p id="dic-modal-texto">—</p>
        <input type="text" id="dic-modal-input" hidden>
        <div class="salir-btns">
            <button class="salir-cancelar" id="dic-modal-no" type="button">
                Cancelar
            </button>
            <button class="salir-si" id="dic-modal-si" type="button">
                Aceptar
            </button>
        </div>
    </div>
</div>

<!-- Menu de acciones por palabra -->
<div class="modal-salir" id="dic-menu" hidden>
    <div class="salir-caja">
        <h3 id="dic-menu-titulo">—</h3>
        <p id="dic-menu-cat" class="dash-nota">—</p>
        <div class="salir-btns">
            <button class="salir-cancelar" id="dic-menu-cancel" type="button">
                Cancelar
            </button>
            <button class="salir-cancelar" id="dic-menu-edit" type="button">
                <i class="fas fa-pen"></i> Editar
            </button>
            <button class="salir-si" id="dic-menu-del" type="button">
                <i class="fas fa-trash"></i> Eliminar
            </button>
        </div>
    </div>
</div>

<div class="modal-salir" id="modal-salir" hidden>
    <div class="modal-salir-caja" role="dialog" aria-modal="true">
        <div class="modal-salir-icono"><i class="fas fa-right-from-bracket"></i></div>
        <h3>¿Cerrar sesión?</h3>
        <p>Se cerrará tu sesión en este dispositivo.</p>
        <div class="modal-salir-btns">
            <button class="btn-cancelar" id="btn-cancelar-salir">Cancelar</button>
            <button class="btn-salir" id="btn-confirmar-salir">Sí, salir</button>
        </div>
    </div>
</div>

<!-- Estadisticas del sitio: solo superusuario -->
<section class="app-view" id="view-dashboard">
    <div class="perfil-card" style="max-width:none;text-align:left">
        <div class="perfil-avatar"><i class="fas fa-chart-pie"></i></div>
        <h3>Estadísticas</h3>
        <p class="perfil-rol">Superusuario</p>
        <button class="est-acc-btn" type="button" data-acc="est-graf-cont">
            <i class="fas fa-chart-pie"></i> Gráficos de las métricas
            <i class="fas fa-chevron-down acc-flecha"></i>
        </button>
        <div class="est-acc-cont" id="est-graf-cont" hidden>
            <canvas id="pie-cat" class="est-pie"></canvas>
            <canvas id="pie-dias" class="est-pie"></canvas>
            <canvas id="pie-rep" class="est-pie"></canvas>
        </div>
        <button class="est-acc-btn" type="button" data-acc="est-resumen">
            <i class="fas fa-chart-line"></i> Estadísticas
            <i class="fas fa-chevron-down acc-flecha"></i>
        </button>
        <div class="est-acc-cont" id="est-resumen" hidden></div>
        <button class="est-acc-btn" type="button" data-acc="est-reportes">
            <i class="fas fa-flag"></i> Reportes
            <i class="fas fa-chevron-down acc-flecha"></i>
        </button>
        <div class="est-acc-cont" id="est-reportes" hidden></div>
        <button class="est-acc-btn" type="button" data-acc="est-likes">
            <i class="fas fa-heart"></i> Likes
            <i class="fas fa-chevron-down acc-flecha"></i>
        </button>
        <div class="est-acc-cont" id="est-likes" hidden></div>
        <button class="est-acc-btn" type="button" data-acc="est-alertas">
            <i class="fas fa-bell"></i> Alertas
            <i class="fas fa-chevron-down acc-flecha"></i>
        </button>
        <div class="est-acc-cont" id="est-alertas" hidden></div>
        <button class="est-acc-btn" type="button" data-acc="est-actividad">
            <i class="fas fa-bolt"></i> Actividad del sitio
            <i class="fas fa-chevron-down acc-flecha"></i>
        </button>
        <div class="est-acc-cont" id="est-actividad" hidden></div>
        <button class="perfil-btn-ajustes" type="button"
                onclick="descargarEstadisticas()">
            <i class="fas fa-file-arrow-down"></i> Descargar
            estadísticas (.txt)
        </button>
        <button class="perfil-btn-ajustes" type="button"
                onclick="irAVista('view-perfil','Perfil')">
            <i class="fas fa-user-circle"></i> Volver a mi perfil
        </button>
    </div>
</section>
