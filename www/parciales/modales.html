<!-- Modales del registro/detalle: categorias + QR -->
<!-- Bottom-sheet de categorias con fondo blur -->
<div class="modal-cat" id="modal-cat" hidden>
    <div class="modal-cat-hoja">
        <div class="modal-cat-encabezado">
            <div class="modal-cat-titulo">Elegí una categoría</div>
            <button type="button" class="modal-cat-x" id="modal-cat-x">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <div class="modal-cat-lista" id="modal-cat-lista"></div>
    </div>
</div>

<div class="modal-qr" id="modal-qr" hidden>
    <div class="modal-qr-caja" role="dialog" aria-modal="true">
        <h3 id="qr-nombre">—</h3>
        <p id="qr-telefono" style="margin:0 0 10px">—</p>
        <canvas id="qr-canvas" width="220" height="220"></canvas>
        <p style="margin:8px 0 0;font-size:.72rem;letter-spacing:.14em;font-weight:800;color:var(--primary-color)">EMPRENDEDORES</p>
        <div style="display:flex;gap:10px;margin-top:14px">
            <button class="rep-cancelar" id="qr-png" style="flex:1"><i class="fas fa-download"></i> PNG</button>
            <a class="rep-cancelar" id="qr-wa" target="_blank" rel="noopener" style="flex:1;text-decoration:none"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div>
        <button class="emp-btn-guardar" id="btn-cerrar-qr" style="margin-top:10px">Cerrar</button>
    </div>
</div>
