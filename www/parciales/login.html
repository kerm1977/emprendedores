<div class="login-overlay" id="login-overlay">
    <div class="login-card">
        <button type="button" class="login-x" id="login-x" title="Volver">
            <i class="fas fa-times"></i>
        </button>
        <img src="img/logo-emprendedores.png" alt="Emprendedores" class="login-logo">

        <div class="login-tabs">
            <button type="button" class="login-tab active" data-tab="ingresar">Ingresar</button>
            <button type="button" class="login-tab" data-tab="registro">Registrarse</button>
        </div>

        <button type="button" class="btn-google" onclick="(window.loginGoogle ? loginGoogle() : showToast('Cargando Google, intentá de nuevo...'))">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
            </svg>
            <span>Ingresar con Google</span>
        </button>

        <form id="form-login" class="login-form" autocomplete="off">
            <label class="login-label">Correo electrónico
                <input type="email" id="login-email" class="login-input" required autocomplete="username">
            </label>
            <label class="login-label">Contraseña
                <span class="pass-wrap">
                    <input type="password" id="login-pass" class="login-input" required autocomplete="current-password">
                    <button type="button" class="pass-ojo" data-ojo="login-pass" title="Ver contraseña"><i class="fas fa-eye"></i></button>
                </span>
            </label>
            <p class="login-error" id="login-error"></p>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <form id="form-registro" class="login-form" hidden autocomplete="off">
            <div class="login-fila">
                <label class="login-label">Nombre
                    <input type="text" id="reg-nombre" class="login-input" required>
                </label>
                <label class="login-label">Apellido
                    <input type="text" id="reg-apellido" class="login-input">
                </label>
            </div>
            <label class="login-label">Correo electrónico
                <input type="email" id="reg-email" class="login-input" required>
            </label>
            <div class="login-fila">
                <label class="login-label">Teléfono
                    <input type="tel" id="reg-telefono" class="login-input">
                </label>
                <label class="login-label">Cédula
                    <input type="text" id="reg-cedula" class="login-input">
                </label>
            </div>
            <label class="login-label">Contraseña
                <span class="pass-wrap">
                    <input type="password" id="reg-pass" class="login-input" required autocomplete="new-password">
                    <button type="button" class="pass-ojo" data-ojo="reg-pass" title="Ver contraseña"><i class="fas fa-eye"></i></button>
                </span>
            </label>
            <label class="login-label">Confirmar contraseña
                <span class="pass-wrap">
                    <input type="password" id="reg-pass2" class="login-input" required autocomplete="new-password">
                    <button type="button" class="pass-ojo" data-ojo="reg-pass2" title="Ver contraseña"><i class="fas fa-eye"></i></button>
                </span>
            </label>
            <p class="login-error" id="reg-error"></p>
            <button type="submit" class="btn-login">Crear cuenta</button>
        </form>

        <button type="button" class="emergencia-toggle" id="emergencia-toggle">
            <i class="fas fa-key"></i> Acceso de emergencia
        </button>

        <div id="emergencia-panel" hidden>
            <div id="emergencia-paso1" class="emergencia-paso1">
                <input type="password" id="emergencia-codigo" class="login-input"
                       inputmode="numeric" placeholder="Código de emergencia">
                <button type="button" class="btn-login btn-sm" id="emergencia-verificar">Verificar</button>
            </div>
            <div id="emergencia-supers" hidden></div>
            <p class="login-error" id="emergencia-error"></p>
        </div>

        <button type="button" class="emergencia-toggle" id="login-cerrar">
            Continuar sin cuenta
        </button>
    </div>
</div>
